<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="./JS/main.js" type="module"></script>
    <link rel="stylesheet" href="./CSS/style.css">
    <title>Panel de Órdenes</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./Assets/img/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./Assets/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./Assets/img/favicons/favicon-16x16.png">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-black" data-bs-theme="dark">
            <div class="container-fluid header-content-custom">
                <a class="navbar-brand" href="#">Makkatillas (Admin)</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="./../Front-end_Usuario/index.html">Ver Menú Cliente</a></li>
                        <li class="nav-item"><a class="nav-link" href="./HTML/Gest_Menu.html">Gestión de Menú</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-fluid mt-4">
        <h2 class="mb-4 text-center">Gestión de Órdenes</h2>

        <div class="row">

            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-warning text-dark fw-bold text-center">
                        <i class="bi bi-clock-history"></i> PENDIENTE
                    </div>
                    <div class="card-body" id="pending-orders-container" style="max-height: 80vh; overflow-y: auto;">
                        <p class="text-center text-muted">Cargando...</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-info text-dark fw-bold text-center">
                        <i class="bi bi-fire"></i> EN PREPARACIÓN
                    </div>
                    <div class="card-body" id="inprogress-orders-container" style="max-height: 80vh; overflow-y: auto;">
                        <p class="text-center text-muted">Cargando...</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white fw-bold text-center">
                        <i class="bi bi-check2-circle"></i> LISTO PARA ENTREGAR
                    </div>
                    <div class="card-body" id="ready-orders-container" style="max-height: 80vh; overflow-y: auto;">
                        <p class="text-center text-muted">Cargando...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div class="modal fade" id="dish-modal" tabindex="-1" aria-labelledby="dish-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="dish-modal-title">Añadir Nuevo Plato</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="dish-form" novalidate>
                    <div class="modal-body">
                        <div class="row mb-3">
                            <div class="col">
                                <label for="dish-name" class="form-label">Nombre del Plato *</label>
                                <input type="text" class="form-control" id="dish-name" required>
                            </div>
                            <div class="col">
                                <label for="dish-price" class="form-label">Precio *</label>
                                <input type="number" class="form-control" id="dish-price" step="0.01" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="dish-category" class="form-label">Categoría *</label>
                            <select class="form-select" id="dish-category" required>
                                <option value="" selected disabled>Cargando categorías...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="dish-description" class="form-label">Descripción</label>
                            <textarea class="form-control" id="dish-description" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="dish-image" class="form-label">URL de la Imagen</label>
                            <input type="url" class="form-control" id="dish-image">
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" role="switch" id="dish-isActive" checked>
                            <label class="form-check-label" for="dish-isActive">Plato Activo</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btn-guardar-plato">Guardar Plato</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Detalles de Orden</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div id="orderDetailsContent">Cargando detalles...</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white text-center p-3 mt-5 fixed-bottom">
        <div class="container-fluid footer-content-custom">
            <p class="m-0">Panel de Administración &copy; 2025</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
